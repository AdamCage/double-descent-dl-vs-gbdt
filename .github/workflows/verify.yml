name: Offline research infrastructure
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      - run: uv run python scripts/check_repository.py --output checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-checks
          path: checks.json
