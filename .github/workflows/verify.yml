name: Offline research infrastructure
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      # Release archives and live runs are deliberately outside the source tree.
      # Full byte-bound validation remains scripts/check_repository.py after restore.
      - run: uv run python scripts/check_source_checkout.py --output checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-checks
          path: checks.json
