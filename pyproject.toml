[project]
name = "double-descent-gbdt"
version = "0.1.0"
description = "Research pipeline: double descent in DNN and CatBoost gradient boosting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "torch>=2.2",
    "plotly>=5.22",
    "kaleido>=0.2",
    "umap-learn>=0.5",
    "aiohttp>=3.9",
    "tqdm>=4.66",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "kagglehub>=0.3",
    "pyarrow>=15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
